# Netlify configuration for Beer Finder (a static site).
#
# The whole app is static files in public/. There's no build to run and
# no server — Netlify just publishes the folder. The beer data lives in
# public/data/ and is refreshed locally with `npm run catalog`.

[build]
  publish = "public"
  command = ""

# Don't let Netlify's npm install try to download Playwright browsers.
[build.environment]
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"
  NPM_FLAGS = "--no-optional"
